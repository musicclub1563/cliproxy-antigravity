name: Build linux-amd64 plugin

# Builds the CLIProxyAPI native plugin (c-shared) for linux/amd64 only and publishes it as a
# downloadable artifact. No release is created and no production credentials are used.
#
# The job runs inside golang:1.23-bullseye so the shared library is linked against glibc 2.31,
# which keeps it loadable on Debian 11/12 and other distributions older than Ubuntu 24.04.

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"

permissions:
  contents: read

env:
  PLUGIN_ID: cliproxy-antigravity

jobs:
  build:
    name: linux/amd64
    runs-on: ubuntu-latest
    container: golang:1.23-bullseye
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 binutils

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          go version
          gcc --version | head -n1
          ldd --version | head -n1

      - name: Format check
        run: test -z "$(gofmt -l *.go scripts/*.go)"

      - name: Unit tests
        run: CGO_ENABLED=1 go test ./...

      - name: Build plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_CFLAGS="-march=x86-64" \
            go build -trimpath -buildmode=c-shared -ldflags "-s -w" \
            -o "dist/${PLUGIN_ID}.so" .
          rm -f dist/*.h

      - name: ABI smoke test
        run: python3 scripts/abi_smoke.py "dist/${PLUGIN_ID}.so"

      - name: Package artifact
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          ARTIFACT="${PLUGIN_ID}-linux-amd64-${SHORT_SHA}"
          VERSION="$(grep -m1 'pluginVersion = ' plugin.go | cut -d'"' -f2)"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=${VERSION}" >> "$GITHUB_ENV"

          cd dist
          sha256sum "${PLUGIN_ID}.so" > "${PLUGIN_ID}.so.sha256"
          CHECKSUM="$(cut -d' ' -f1 "${PLUGIN_ID}.so.sha256")"
          SIZE="$(stat -c%s "${PLUGIN_ID}.so")"
          GLIBC_REQ="$(objdump -T "${PLUGIN_ID}.so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1 || echo unknown)"
          nm -D --defined-only "${PLUGIN_ID}.so" | grep cliproxy_plugin_init

          {
            printf '# %s %s (linux/amd64)\n\n' "${PLUGIN_ID}" "${VERSION}"
            printf -- '- Commit: %s\n' "${GITHUB_SHA}"
            printf -- '- Built at: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf -- '- Size: %s bytes\n' "${SIZE}"
            printf -- '- SHA256: %s\n' "${CHECKSUM}"
            printf -- '- Highest required glibc symbol: %s\n\n' "${GLIBC_REQ}"
            printf '## Install\n\n'
            printf '1. Stop CLIProxyAPI.\n'
            printf '2. Back up the current library: `cp plugins/%s.so plugins/%s.so.bak-$(date +%%Y%%m%%d%%H%%M)`\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '3. Copy this file to `plugins/%s.so` and make it readable: `chmod 755 plugins/%s.so`\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '4. Start CLIProxyAPI and confirm the plugin loaded with the new version in the log:\n'
            printf '   `pluginhost: plugin registered plugin_id=%s version=<expected>`\n' "${PLUGIN_ID}"
            printf '5. Check the catalog. Dynamic models must be back:\n'
            printf '   `curl -s http://127.0.0.1:8317/v1/models -H "Authorization: Bearer <api-key>" | grep -o "agy/[a-z0-9.-]*" | sort -u`\n'
            printf '   Expected entries include `agy/gemini-3.8-flash-high`, `agy/claude-sonnet-4-6`, `agy/gpt-oss-120b-medium`.\n\n'
            printf '## Verify\n\n'
            printf '```\nsha256sum -c %s.so.sha256\nldd -r ./%s.so\n```\n\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '## Rollback\n\n'
            printf '1. Stop CLIProxyAPI.\n'
            printf '2. `mv plugins/%s.so.bak-<timestamp> plugins/%s.so`\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '3. Start CLIProxyAPI. The previous catalog behavior returns.\n'
          } > INSTALL.md

          echo "GLIBC_REQ=${GLIBC_REQ}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${CHECKSUM}" >> "$GITHUB_ENV"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/cliproxy-antigravity.so
            dist/cliproxy-antigravity.so.sha256
            dist/INSTALL.md
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "## cliproxy-antigravity linux/amd64"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| artifact | \`${ARTIFACT}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| glibc baseline | \`${GLIBC_REQ}\` |"
            echo "| sha256 | \`${CHECKSUM}\` |"
            echo
            echo "Download the artifact from this run, then follow \`INSTALL.md\` inside it."
            echo "This job only proves the build, unit tests and ABI smoke test; it does not validate a live server."
          } >> "$GITHUB_STEP_SUMMARY"
