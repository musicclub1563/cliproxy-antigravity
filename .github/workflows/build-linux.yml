name: Build linux plugins

# Builds the CLIProxyAPI native plugin (c-shared) for linux/amd64 and linux/arm64 and publishes
# each as a downloadable artifact. No release is created and no production credentials are used.
#
# Both architectures are built inside golang:1.23-bullseye (Debian 11, glibc 2.31) so the shared
# libraries stay loadable on Debian 11/12 and other distributions older than the runner image.
# The arm64 build runs in the same image through QEMU, so it is a native build rather than a
# cross-compile against a newer sysroot.

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"

permissions:
  contents: read

env:
  PLUGIN_ID: cliproxy-antigravity
  GO_VERSION: "1.23.x"

jobs:
  test:
    name: Tests and ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l *.go scripts/*.go)"

      - name: Unit tests
        run: CGO_ENABLED=1 go test ./...

      - name: Build plugin for the ABI smoke test
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOAMD64=v1 CGO_CFLAGS="-march=x86-64" \
            go build -trimpath -buildmode=c-shared -ldflags "-s -w" \
            -o "dist/${PLUGIN_ID}.so" .
          rm -f dist/*.h

      - name: ABI smoke test
        run: python3 scripts/abi_smoke.py "dist/${PLUGIN_ID}.so"

  build:
    name: linux/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            cflags: -march=x86-64
            goarm64: ""
          - arch: arm64
            platform: linux/arm64
            cflags: -march=armv8-a
            goarm64: v8.0
    steps:
      - name: Enable arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - uses: actions/checkout@v4

      - name: Build in the pinned glibc container
        run: |
          set -euo pipefail
          mkdir -p dist
          # -buildvcs=false: git inside the container refuses the mounted checkout, and a plugin
          # does not need VCS stamping.
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GOPATH=/tmp/go -e GOCACHE=/tmp/gocache \
            -e PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e CGO_ENABLED=1 -e GOOS=linux -e GOARCH="${{ matrix.arch }}" \
            -e GOARM64="${{ matrix.goarm64 }}" -e CGO_CFLAGS="${{ matrix.cflags }}" \
            -e PLUGIN_ID="${PLUGIN_ID}" \
            -v "$PWD:/src" -w /src \
            golang:1.23-bullseye \
            bash -c 'set -euo pipefail
              go version
              # sed reads the whole stream, so pipefail never trips on SIGPIPE the way head does.
              gcc --version | sed -n "1p"
              ldd --version | sed -n "1p"
              go build -trimpath -buildvcs=false -buildmode=c-shared -ldflags "-s -w" \
                -o "dist/${PLUGIN_ID}.so" .
              rm -f dist/*.h
              (objdump -T "dist/${PLUGIN_ID}.so" | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -n1 || echo unknown) > dist/.glibc'

      - name: Package artifact
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          ARCH="${{ matrix.arch }}"
          ARTIFACT="${PLUGIN_ID}-linux-${ARCH}-${SHORT_SHA}"
          VERSION="$(grep -m1 'pluginVersion = ' plugin.go | cut -d'"' -f2)"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"

          cd dist
          sha256sum "${PLUGIN_ID}.so" > "${PLUGIN_ID}.so.sha256"
          CHECKSUM="$(cut -d' ' -f1 "${PLUGIN_ID}.so.sha256")"
          SIZE="$(stat -c%s "${PLUGIN_ID}.so")"
          GLIBC_REQ="$(cat .glibc 2>/dev/null || echo unknown)"
          rm -f .glibc

          {
            printf '# %s %s (linux/%s)\n\n' "${PLUGIN_ID}" "${VERSION}" "${ARCH}"
            printf -- '- Commit: %s\n' "${GITHUB_SHA}"
            printf -- '- Built at: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf -- '- Size: %s bytes\n' "${SIZE}"
            printf -- '- SHA256: %s\n' "${CHECKSUM}"
            printf -- '- Highest required glibc symbol: %s\n\n' "${GLIBC_REQ}"
            printf '## Install\n\n'
            printf '1. Stop CLIProxyAPI.\n'
            printf '2. Back up the current library: `cp plugins/%s.so plugins/%s.so.bak-$(date +%%Y%%m%%d%%H%%M)`\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '3. Copy this file to `plugins/%s.so` and make it readable: `chmod 755 plugins/%s.so`\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '4. Start CLIProxyAPI and confirm the plugin registered with the new version in the log.\n'
            printf '5. Check the catalog; the dynamically discovered models must be back:\n'
            printf '   `curl -s http://127.0.0.1:8317/v1/models -H "Authorization: Bearer <api-key>" | grep -o "\\"id\\":\\"[^\\"]*\\"" | sort -u`\n\n'
            printf '## Verify\n\n'
            printf '```\nsha256sum -c %s.so.sha256\nldd -r ./%s.so\n```\n\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '## Rollback\n\n'
            printf '1. Stop CLIProxyAPI.\n'
            printf '2. `mv plugins/%s.so.bak-<timestamp> plugins/%s.so`\n' "${PLUGIN_ID}" "${PLUGIN_ID}"
            printf '3. Start CLIProxyAPI. The previous catalog behavior returns.\n'
          } > INSTALL.md

          echo "GLIBC_REQ=${GLIBC_REQ}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${CHECKSUM}" >> "$GITHUB_ENV"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/cliproxy-antigravity.so
            dist/cliproxy-antigravity.so.sha256
            dist/INSTALL.md
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "## cliproxy-antigravity linux/${ARCH}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| artifact | \`${ARTIFACT}\` |"
            echo "| plugin version | \`${PLUGIN_VERSION}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| glibc baseline | \`${GLIBC_REQ}\` |"
            echo "| sha256 | \`${CHECKSUM}\` |"
            echo
            echo "Download the artifact from this run, then follow \`INSTALL.md\` inside it."
            echo "This job proves the build, unit tests and ABI smoke test only; it does not validate a live server."
          } >> "$GITHUB_STEP_SUMMARY"
